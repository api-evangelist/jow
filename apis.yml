name: Jow
description: 'Jow is a consumer meal-planning and grocery-shopping application that
  turns personalized menu selection into an automated shopping list. From a catalog
  of thousands of recipes tailored to household size, dietary preferences and goals
  (keto, vegetarian, high-protein, gluten-free, kid-friendly, low-calorie), Jow builds
  a weekly menu and generates the matching grocery order, which users check out through
  integrated grocery-retail partnerships at optimized prices. Founded in France and
  available as iOS and Android mobile apps, Jow serves millions of active users. It
  is a portfolio company of Northzone. No public developer API or documentation surface
  was found during enrichment; this profile captures the company identity and its
  probed domain-security posture.'
